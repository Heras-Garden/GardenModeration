name: Build GardenModeration

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GardenModeration
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Checkout GardenCore
        uses: actions/checkout@v4
        with:
          repository: Heras-Garden/GardenCore
          path: GardenCore
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install GardenCore API
        run: mvn -B -f GardenCore/pom.xml -DskipTests install
      - name: Build GardenModeration
        run: mvn -B -f plugin/pom.xml clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GardenModeration
          path: plugin/target/GardenModeration-*.jar
